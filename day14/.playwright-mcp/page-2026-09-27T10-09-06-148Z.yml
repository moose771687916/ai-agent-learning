                          - text: 上国乒实现男团12连冠、女团七连冠，继续保持在世界乒坛的统治地位。‌‌
                          - button "参考文档，单指双击即可执行" [ref=e563]:
                            - generic [ref=e564]: 百科
                        - listitem [ref=e567]:
                          - text: 乒乓球1988年正式成为奥运会比赛项目，2008年北京奥运会起奥运赛场取消双打项目改为团体赛，截至2024年巴黎奥运会，国乒已经包揽了奥运会乒乓球全部5个项目的金牌。‌‌
                          - button "参考文档，单指双击即可执行" [ref=e568]:
                            - generic [ref=e569]: 百科
                    - generic [ref=e572]:
                      - generic [ref=e573]:
                        - generic [ref=e574]: 比赛规则与场地装备标准
                        - text: 
                      - list [ref=e585]:
                        - listitem [ref=e586]:
                          - text: 正式比赛采用11分制，每两分轮换发球权，单局比赛先得到11分且领先对手2分的选手获胜，单打、双打赛事一般采用七局四胜制，团体赛为五场三胜制，每场比赛五局三胜。‌‌‌
                          - generic [ref=e587]: 
                        - listitem [ref=e593]:
                          - text: 标准比赛场地的球台尺寸为长2.74米、宽1.525米、高0.76米，台面为暗色无光泽材质，球网高度为15.25厘米，网宽1.83米，悬挂在台面中央位置。‌‌‌
                          - generic [ref=e594]: 
                        - listitem [ref=e600]:
                          - text: 比赛用球直径为40毫米，重量为2.7克，颜色统一为白色或橙色，三星级球是国际正式赛事的指定用球，二星级适合日常训练使用，一星级多用于休闲娱乐场景。‌‌‌
                          - generic [ref=e601]: 
                        - listitem [ref=e607]:
                          - text: 发球环节要求发球者必须将球近乎垂直向上抛起至少16厘米，不得让球旋转，球从最高点下落之后才能击球，球需要先触碰发球方半台，越过球网后再落到接发球方半台，否则直接判定发球失分。‌‌‌
                          - generic [ref=e608]: 
